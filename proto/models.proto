// ============================================================
// Sites, Subsites, and Public Render Blocks
// ============================================================

message Site {
    int64 id = 1;
    string slug = 2;
    string name = 3;
    string site_type = 4;
    string primary_domain = 5;
    string network_id = 6;
    bool is_global = 7;
    bool is_default = 8;
    bool enabled = 9;
    bool public = 10;
    string status = 11;
    string access_mode = 12;
    string access_config_json = 13;
    reserved 14, 17; // dropped: template_key, navigation_json
    int64 api_key_id = 15;
    string theme_config_json = 16;
    string settings_json = 18;
    string meta_title = 19;
    string meta_description = 20;
    string og_image_url = 21;
    string favicon_url = 22;
    google.protobuf.Timestamp publish_at = 23;
    google.protobuf.Timestamp unpublish_at = 24;
    string created_by_uuid = 25;
    string updated_by_uuid = 26;
    google.protobuf.Timestamp created_at = 27;
    google.protobuf.Timestamp updated_at = 28;
    // Raw HTML injected into the public chrome's <head>. Used for third-party
    // analytics snippets (Plausible, Umami, GA4) alongside the built-in
    // pageview beacon.
    string analytics_script_html = 29;
    google.protobuf.Timestamp domain_verified_at = 30;
    string domain_verify_challenge = 31;
}

// SiteDomainAlias maps an additional host to a site beyond primary_domain.
message SiteDomainAlias {
    int64 id = 1;
    int64 site_id = 2;
    string host = 3;
    string created_by_uuid = 4;
    google.protobuf.Timestamp created_at = 5;
}

message Subsite {
    int64 id = 1;
    int64 site_id = 2;
    string slug = 3;
    string name = 4;
    string scope_type = 5;
    string scope_value = 6;
    bool enabled = 7;
    bool public = 8;
    string status = 9;
    string access_mode = 10;
    string access_config_json = 11;
    string theme_config_json = 12;
    string settings_json = 13;
    string meta_title = 14;
    string meta_description = 15;
    string og_image_url = 16;
    google.protobuf.Timestamp publish_at = 17;
    google.protobuf.Timestamp unpublish_at = 18;
    string created_by_uuid = 19;
    string updated_by_uuid = 20;
    google.protobuf.Timestamp created_at = 21;
    google.protobuf.Timestamp updated_at = 22;
}

// Per (site, subsite) document holding the block tree as serialized JSON.
// `draft_json` is what the editor reads/writes; `published_json` is what the public site renders.
// On Publish, draft_json is copied into published_json and a new SiteDocumentVersion row is recorded.
message SiteDocument {
    int64 id = 1;
    int64 site_id = 2;
    int64 subsite_id = 3;
    string draft_json = 4;
    string published_json = 5;
    int32 current_version = 6;
    google.protobuf.Timestamp last_published_at = 7;
    string last_published_by_uuid = 8;
    string updated_by_uuid = 9;
    google.protobuf.Timestamp created_at = 10;
    google.protobuf.Timestamp updated_at = 11;
    // Scheduled-publish queue: when scheduled_publish_at is set, the scheduler
    // service will copy draft_json into published_json at that time using
    // scheduled_publish_by_uuid as the publishing actor.
    google.protobuf.Timestamp scheduled_publish_at = 12;
    string scheduled_publish_by_uuid = 13;
    // Per-page SEO metadata. Empty strings fall back to site-level meta on
    // the parent Site message. og_image_asset_id is a SiteAsset id resolved
    // to a URL by the renderer. noindex emits a robots meta tag AND
    // excludes the page from the per-site sitemap.
    string meta_title = 14;
    string meta_description = 15;
    int64 og_image_asset_id = 16;
    string canonical_url = 17;
    bool noindex = 18;
    // BCP-47 locale tag (e.g. "en", "fr", "pt-BR"). Empty = no locale (the
    // default for all existing documents). The public render route picks
    // the document matching the visitor's Accept-Language when present;
    // otherwise falls back to the empty-locale row.
    string locale = 19;
}

// SiteDocumentAutosave is an in-editor undo checkpoint. Written automatically by
// UpdateSiteDocumentDraft whenever the draft body actually changes. The server
// prunes per-document history to the most recent 20 entries.
message SiteDocumentAutosave {
    int64 id = 1;
    int64 document_id = 2;
    string draft_json = 3;
    string created_by_uuid = 4;
    google.protobuf.Timestamp created_at = 5;
}

// SiteDocumentEditLock is a soft lock (TTL 5 minutes) that prevents two editors
// from clobbering each other. UpdateSiteDocumentDraft rejects writes from
// callers other than the holder unless force_unlock is set on the request.
message SiteDocumentEditLock {
    int64 document_id = 1;
    string holder_uuid = 2;
    string holder_name = 3;
    google.protobuf.Timestamp claimed_at = 4;
    google.protobuf.Timestamp expires_at = 5;
}

message SiteDocumentVersion {
    int64 id = 1;
    int64 document_id = 2;
    int32 version_number = 3;
    string document_json = 4;
    string published_by_uuid = 5;
    google.protobuf.Timestamp published_at = 6;
}

message SiteNavItem {
    int64 id = 1;
    int64 site_id = 2;
    int64 parent_id = 3;
    string label = 4;
    string href = 5;
    string target = 6;
    bool visible = 7;
    int32 sort_order = 8;
    string required_permission = 9;
    string access_mode = 10;
    google.protobuf.Timestamp created_at = 11;
    google.protobuf.Timestamp updated_at = 12;
}

message WorldMap {
    int64 id = 1;
    string network_id = 2;
    string server_name = 3;
    string provider = 4;
    string display_name = 5;
    string world_name = 6;
    string base_url = 7;
    string embed_url = 8;
    string thumbnail_url = 9;
    bool enabled = 10;
    bool public = 11;
    string config_json = 12;
    google.protobuf.Timestamp created_at = 13;
    google.protobuf.Timestamp updated_at = 14;
    int64 site_id = 15;
    int64 subsite_id = 16;
    int32 sort_order = 17;
}

message WorldMapMarker {
    int64 id = 1;
    int64 map_id = 2;
    string marker_group = 3;
    string label = 4;
    string marker_type = 5;
    double x = 6;
    double y = 7;
    double z = 8;
    string icon = 9;
    string color = 10;
    string description = 11;
    string link_url = 12;
    bool visible = 13;
    google.protobuf.Timestamp created_at = 14;
    google.protobuf.Timestamp updated_at = 15;
}

message SiteAsset {
    int64 id = 1;
    int64 site_id = 2;
    int64 subsite_id = 3;
    string asset_type = 4;
    string name = 5;
    // Public URL. For server-stored assets this is /api/v1/site-assets/{id};
    // for external assets (CDN, Nextcloud share, etc.) the caller sets it directly.
    string url = 6;
    string mime_type = 7;
    int64 size_bytes = 8;
    string metadata_json = 9;
    string created_by_uuid = 10;
    google.protobuf.Timestamp created_at = 11;
    int32 width = 12;
    int32 height = 13;
    string alt_text = 14;
    // Focal point as 0..1 fractions. Used by the renderer to crop into fixed
    // aspect ratios without cutting off the subject.
    double focal_x = 15;
    double focal_y = 16;
    // GENERAL | BACKGROUND | HERO | FAVICON | OG (free-form on the server side).
    string role = 17;
    // Filesystem-relative path written by internal/storage. Empty for
    // externally-hosted assets.
    string storage_path = 18;
    string checksum_sha256 = 19;
    // When true, this asset is visible from every site's asset picker.
    bool is_shared = 20;
}

message SiteRenderSnapshot {
    Site site = 1;
    repeated SiteNavItem navigation = 2;
    repeated SiteAsset assets = 3;
    reserved 4; // dropped: repeated SiteContentBlock content_blocks
    repeated WorldMap world_maps = 5;
    string cache_version = 6;
    google.protobuf.Timestamp generated_at = 7;
    // Published block-tree document (JSON). Empty when the site has never been published.
    string document_json = 8;
    // Per-page SEO metadata copied from the matching SiteDocument so the
    // public render path doesn't need a second RPC to build the page <head>.
    string document_meta_title = 9;
    string document_meta_description = 10;
    int64 document_og_image_asset_id = 11;
    string document_canonical_url = 12;
    bool document_noindex = 13;
}

message SubsiteRenderSnapshot {
    Site site = 1;
    Subsite subsite = 2;
    repeated SiteNavItem navigation = 3;
    repeated SiteAsset assets = 4;
    reserved 5; // dropped: repeated SiteContentBlock content_blocks
    repeated WorldMap world_maps = 6;
    string cache_version = 7;
    google.protobuf.Timestamp generated_at = 8;
    string document_json = 9;
    string document_meta_title = 10;
    string document_meta_description = 11;
    int64 document_og_image_asset_id = 12;
    string document_canonical_url = 13;
    bool document_noindex = 14;
}

// Reusable block-tree fragment that staff can stamp into a site/subsite draft.
// blocks_json holds a JSON array of blocks matching the editor schema documented
// in nexus-proto/docs/site-builder-blocks.md. category is a free-form tag used
// by the editor to group snippets in its picker (LAYOUT, HERO, CARDS, FOOTER, ...).
message SiteDocumentSnippet {
    int64 id = 1;
    string snippet_key = 2;
    string name = 3;
    string description = 4;
    string category = 5;
    string blocks_json = 6;
    string preview_image_url = 7;
    string created_by_uuid = 8;
    string updated_by_uuid = 9;
    google.protobuf.Timestamp created_at = 10;
    google.protobuf.Timestamp updated_at = 11;
}

// SitePageviewDailyCount is one day's pageview + unique-visitor count for
// a site. Used by the analytics dashboard chart.
message SitePageviewDailyCount {
    string day = 1;         // ISO date (YYYY-MM-DD)
    int64 views = 2;
    int64 visitors = 3;     // distinct ip_hash count
}

// SitePageviewTopPath / TopReferrer are aggregate rows for the "Top pages"
// and "Top referrers" tables in the dashboard.
message SitePageviewTopPath {
    string path = 1;
    int64 views = 2;
    int64 visitors = 3;
}
message SitePageviewTopReferrer {
    string host = 1;
    int64 views = 2;
}

// SiteComment is one comment on a comments block. Threaded via parent_id.
// status: APPROVED | HIDDEN | PENDING. Public reads return APPROVED only.
message SiteComment {
    int64 id = 1;
    int64 site_id = 2;
    int64 subsite_id = 3;
    string block_id = 4;
    int64 parent_id = 5;        // 0 = top-level
    string body_md = 6;
    string author_name = 7;
    string author_uuid = 8;
    string author_ip = 9;
    string status = 10;
    string moderated_by_uuid = 11;
    google.protobuf.Timestamp moderated_at = 12;
    google.protobuf.Timestamp created_at = 13;
    google.protobuf.Timestamp updated_at = 14;
}

// SiteReactionCount is one emoji's tally on a reactions block.
message SiteReactionCount {
    string emoji_key = 1;
    int64 count = 2;
}

// SiteReactionCounts is the public aggregated view: per-emoji counts plus
// the emojis the current viewer has reacted with (highlighted in the UI).
message SiteReactionCounts {
    string block_id = 1;
    repeated SiteReactionCount counts = 2;
    repeated string viewer_picks = 3;
}

// SitePollOptionResult is one option's tally inside a poll block. count is
// the number of voters who picked this option; for multi-choice polls a
// single voter can contribute to multiple options.
message SitePollOptionResult {
    string option_key = 1;
    int64 count = 2;
}

// SitePollResults is the public, aggregated view of a poll block. No PII —
// just per-option counts plus the total distinct voter count.
message SitePollResults {
    string block_id = 1;
    repeated SitePollOptionResult options = 2;
    int64 total_voters = 3;
    bool viewer_has_voted = 4;
}

// SiteVoteEvent is one Votifier-style vote logged for a site. Aggregation is
// COUNT(*) over a rolling window — no amount field. external_id dedupes
// webhook re-deliveries.
message SiteVoteEvent {
    int64 id = 1;
    int64 site_id = 2;
    string voter_uuid = 3;
    string voter_name = 4;
    string voter_ip = 5;
    string source = 6;
    string external_id = 7;
    string note = 8;
    google.protobuf.Timestamp occurred_at = 9;
    google.protobuf.Timestamp created_at = 10;
}

// SiteDonationEvent is one logged donation, typically from a Tebex webhook.
// Stored verbatim so block aggregations can compute monthly totals without
// hitting the external API per render.
message SiteDonationEvent {
    int64 id = 1;
    int64 site_id = 2;
    // Donor display name (may be empty for anonymous Tebex purchases).
    string donor_name = 3;
    // Amount in minor units of `currency` (cents for USD, pence for GBP, etc.).
    int64 amount_minor = 4;
    string currency = 5;          // ISO 4217 (USD, EUR, GBP, ...)
    string source = 6;             // free-form: "tebex" | "manual" | etc.
    string external_id = 7;        // dedup key — e.g. Tebex transaction id
    string note = 8;               // optional comment shown in dashboard
    google.protobuf.Timestamp occurred_at = 9;
    google.protobuf.Timestamp created_at = 10;
}

// SiteFormSubmission is one inbox row from a form block submission. payload_json
// holds the typed values keyed by each form field's `key`. submitter_uuid is
// empty for anonymous submissions.
message SiteFormSubmission {
    int64 id = 1;
    int64 site_id = 2;
    int64 subsite_id = 3;
    string block_id = 4;
    string payload_json = 5;
    string submitter_uuid = 6;
    string submitter_ip = 7;
    string user_agent = 8;
    google.protobuf.Timestamp created_at = 9;
}

// SiteThemePreset is a saved theme blueprint. Apply with one click from the
// site editor. theme_json is the same shape as Site.theme_config_json.
message SiteThemePreset {
    int64 id = 1;
    string preset_key = 2;
    string name = 3;
    string description = 4;
    string theme_json = 5;
    string created_by_uuid = 6;
    string updated_by_uuid = 7;
    google.protobuf.Timestamp created_at = 8;
    google.protobuf.Timestamp updated_at = 9;
}

// SiteTemplatePage is one page entry inside a SiteTemplate's pages list.
// subsite_slug = "" identifies the site root. document_json is the published
// snapshot the new site will start with (written into the draft on clone, NOT
// auto-published). Per-page SEO mirrors the SiteDocument fields.
message SiteTemplatePage {
    string subsite_slug = 1;
    string name = 2;
    string document_json = 3;
    string meta_title = 4;
    string meta_description = 5;
    int64 og_image_asset_id = 6;
    string canonical_url = 7;
    bool noindex = 8;
}

// SiteTemplate captures a site blueprint — theme + nav + pages. Used by
// CreateSiteFromTemplate to spin up a new site pre-populated with the
// template's content. Asset references inside document_json are NOT rewritten
// during the clone; the new site owner re-uploads and re-picks assets after
// the site is created.
message SiteTemplate {
    int64 id = 1;
    string template_key = 2;
    string name = 3;
    string description = 4;
    string preview_image_url = 5;
    // Site theme JSON (same shape as Site.theme_config_json).
    string theme_json = 6;
    // Flat list of nav items: [{label, href, target, sortOrder}, ...]
    string nav_json = 7;
    // Decoded pages list. Stored on the server as the JSON string field
    // pages_json; surfaced as typed messages on the wire so clients don't
    // need to parse a second blob.
    repeated SiteTemplatePage pages = 8;
    string created_by_uuid = 9;
    string updated_by_uuid = 10;
    google.protobuf.Timestamp created_at = 11;
    google.protobuf.Timestamp updated_at = 12;
}

// SiteAnnouncement is a cross-site banner broadcast. target_scope =
// ALL | NETWORK | SITES. starts_at / ends_at are optional bounds (empty =
// open). dismissible controls whether the banner offers a "close" button on
// the public site; dismissal is client-side per id (localStorage), no
// per-user state on the server.
message SiteAnnouncement {
    int64 id = 1;
    string title = 2;
    string body = 3;
    string variant = 4;                       // INFO | SUCCESS | WARNING | DANGER
    string link_url = 5;
    string link_label = 6;
    google.protobuf.Timestamp starts_at = 7;  // unset = no lower bound
    google.protobuf.Timestamp ends_at = 8;    // unset = no upper bound
    string target_scope = 9;                  // ALL | NETWORK | SITES
    string target_network_id = 10;            // used when target_scope = NETWORK
    repeated int64 target_site_ids = 11;      // used when target_scope = SITES
    bool dismissible = 12;
    bool enabled = 13;
    string created_by_uuid = 14;
    string updated_by_uuid = 15;
    google.protobuf.Timestamp created_at = 16;
    google.protobuf.Timestamp updated_at = 17;
}

// ============================================================
// Wiki
// ============================================================

// Per-site wiki configuration. One row per site that has a wiki enabled.
message WikiSettings {
    int64 site_id = 1;
    int64 subsite_id = 2;
    bool enabled = 3;
    string path_prefix = 4;
    int64 home_article_id = 5;
    string settings_json = 6;
    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp updated_at = 8;
}

// One hierarchical wiki article. `draft_json` / `published_json` use the same
// block-tree shape as SiteDocument. `slug_path` is the denormalized full path
// (e.g. "guides/getting-started"). `current_revision` counts per-edit
// revisions stored in WikiArticleRevision (Wikipedia-style, not per-publish).
message WikiArticle {
    int64 id = 1;
    int64 site_id = 2;
    int64 parent_id = 3;
    string slug = 4;
    string slug_path = 5;
    string title = 6;
    string summary = 7;
    string status = 8;
    string draft_json = 9;
    string published_json = 10;
    int32 current_revision = 11;
    google.protobuf.Timestamp last_published_at = 12;
    string last_published_by_uuid = 13;
    int32 sort_order = 14;
    string meta_title = 15;
    string meta_description = 16;
    int64 og_image_asset_id = 17;
    string canonical_url = 18;
    bool noindex = 19;
    string locale = 20;
    string created_by_uuid = 21;
    string updated_by_uuid = 22;
    google.protobuf.Timestamp created_at = 23;
    google.protobuf.Timestamp updated_at = 24;
}

message WikiArticleRevision {
    int64 id = 1;
    int64 article_id = 2;
    int32 revision_number = 3;
    string title = 4;
    string body_json = 5;
    string change_summary = 6;
    bool is_published = 7;
    string author_uuid = 8;
    google.protobuf.Timestamp created_at = 9;
}

message WikiArticleAutosave {
    int64 id = 1;
    int64 article_id = 2;
    string draft_json = 3;
    string created_by_uuid = 4;
    google.protobuf.Timestamp created_at = 5;
}

message WikiArticleLock {
    int64 article_id = 1;
    string holder_uuid = 2;
    string holder_name = 3;
    google.protobuf.Timestamp claimed_at = 4;
    google.protobuf.Timestamp expires_at = 5;
}

// ============================================================
// Blog
// ============================================================

message BlogSettings {
    int64 site_id = 1;
    int64 subsite_id = 2;
    bool enabled = 3;
    string path_prefix = 4;
    int32 posts_per_page = 5;
    bool feed_enabled = 6;
    string feed_title = 7;
    string settings_json = 8;
    google.protobuf.Timestamp created_at = 9;
    google.protobuf.Timestamp updated_at = 10;
}

// One authored blog post. `publish_at` is the scheduled fire time when status
// is SCHEDULED; `published_at` is the effective publish time (stamped on the
// first DRAFT->PUBLISHED transition) and is what archives sort by.
message BlogPost {
    int64 id = 1;
    int64 site_id = 2;
    string author_uuid = 3;
    string slug = 4;
    string title = 5;
    string excerpt = 6;
    int64 hero_asset_id = 7;
    string status = 8;
    string draft_json = 9;
    string published_json = 10;
    int32 current_version = 11;
    google.protobuf.Timestamp publish_at = 12;
    google.protobuf.Timestamp published_at = 13;
    google.protobuf.Timestamp unpublish_at = 14;
    bool allow_comments = 15;
    string meta_title = 16;
    string meta_description = 17;
    int64 og_image_asset_id = 18;
    string canonical_url = 19;
    bool noindex = 20;
    string locale = 21;
    google.protobuf.Timestamp created_at = 22;
    google.protobuf.Timestamp updated_at = 23;
}

message BlogPostVersion {
    int64 id = 1;
    int64 post_id = 2;
    int32 version_number = 3;
    string document_json = 4;
    string published_by_uuid = 5;
    google.protobuf.Timestamp published_at = 6;
}

message BlogPostAutosave {
    int64 id = 1;
    int64 post_id = 2;
    string draft_json = 3;
    string created_by_uuid = 4;
    google.protobuf.Timestamp created_at = 5;
}

message BlogPostLock {
    int64 post_id = 1;
    string holder_uuid = 2;
    string holder_name = 3;
    google.protobuf.Timestamp claimed_at = 4;
    google.protobuf.Timestamp expires_at = 5;
}

// ============================================================
// Content taxonomy (shared wiki + blog)
// ============================================================

// Categories/tags scoped by `kind` ("WIKI" or "BLOG") so wiki and blog don't
// collide. Assignment to articles/posts is polymorphic via (target_kind,
// target_id).
message ContentCategory {
    int64 id = 1;
    int64 site_id = 2;
    string kind = 3;
    string slug = 4;
    string name = 5;
    string description = 6;
    int64 parent_id = 7;
    int32 sort_order = 8;
    google.protobuf.Timestamp created_at = 9;
    google.protobuf.Timestamp updated_at = 10;
}

message ContentTag {
    int64 id = 1;
    int64 site_id = 2;
    string kind = 3;
    string slug = 4;
    string name = 5;
    google.protobuf.Timestamp created_at = 6;
}

// ============================================================
// Common / Utility
// ============================================================

message Empty {}

message PaginationRequest {
    int32 page_size = 1;
    string page_token = 2;
}

message PaginationResponse {
    string next_page_token = 1;
    int32 total_count = 2;
}
